plugins {
    id "com.android.application"
}

def repositoryRoot = file("../..").canonicalFile
def dependencyRoot = new File(rootProject.layout.buildDirectory.get().asFile,
    "android-deps")

dependencies {
    implementation files(new File(dependencyRoot, "SDL3-3.4.18.aar"))
}

def vulkanShaderAssets = layout.buildDirectory.dir("generated/vulkan-assets").get().asFile
def vulkanShaderSources = new File(repositoryRoot, "libsrc/lgd3d/shaders")
def vulkanSdk = System.getenv("VULKAN_SDK")
def isWindowsHost = System.getProperty("os.name").toLowerCase().contains("windows")
def glslc = vulkanSdk
    ? new File(vulkanSdk, isWindowsHost ? "Bin/glslc.exe" : "bin/glslc").absolutePath
    : (isWindowsHost ? "glslc.exe" : "glslc")
def openalRoot = new File(dependencyRoot, "openal-soft-1.25.2")
def vulkanHeadersRoot = new File(dependencyRoot,
    "Vulkan-Headers-vulkan-sdk-1.4.363.0")
def nativeArguments = [
    "-DDARK_COMPILE_VULKAN_SHADERS=OFF",
    "-DDARK_VULKAN_HEADERS_SOURCE=${vulkanHeadersRoot.absolutePath.replace('\\', '/')}",
    "-DDARK_OPENAL_SOFT_SOURCE=${openalRoot.absolutePath.replace('\\', '/')}",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
]

tasks.register("compileVulkanShaders") {
    inputs.files(new File(vulkanShaderSources, "scene.vert"),
        new File(vulkanShaderSources, "scene.frag"))
    outputs.files(new File(vulkanShaderAssets, "vulkan/scene.vert.spv"),
        new File(vulkanShaderAssets, "vulkan/scene.frag.spv"))
    doLast {
        def outputDirectory = new File(vulkanShaderAssets, "vulkan")
        outputDirectory.mkdirs()
        ["scene.vert", "scene.frag"].each { shader ->
            def process = new ProcessBuilder(glslc, "--target-env=vulkan1.1",
                new File(vulkanShaderSources, shader).absolutePath,
                "-o", new File(outputDirectory, "${shader}.spv").absolutePath)
                .inheritIO()
                .start()
            if (process.waitFor() != 0) {
                throw new GradleException("glslc failed to compile ${shader}")
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("compileVulkanShaders")
}

android {
    namespace = "io.github.inkmakerdroid.darkengine"
    compileSdk = 36
    ndkVersion = "30.0.16248370"

    buildFeatures {
        prefab true
    }

    defaultConfig {
        applicationId = "io.github.inkmakerdroid.darkengine"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "0.1.1"

        externalNativeBuild {
            cmake {
                arguments.addAll(nativeArguments)
                abiFilters.add("arm64-v8a")
                targets.add("thief2")
            }
        }
    }

    sourceSets {
        main.assets.srcDir(vulkanShaderAssets)
    }

    externalNativeBuild {
        cmake {
            path = new File(repositoryRoot, "CMakeLists.txt")
            version = "3.31.6"
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            minifyEnabled = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError = true
        lintConfig = file("lint.xml")
    }
}
