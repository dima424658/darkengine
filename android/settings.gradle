import java.security.MessageDigest

def sdlVersion = "3.4.18"
def sdlArchiveHash = "e09e4d6593335d089ba124375e8b8abd0fd75173dffcd2c17012b45af121d4e9"
def sdlAarHash = "bea5cbd6ec56a247196d70c3626860e0d6f36163e562e20a33041bee2fb339f8"
def openalVersion = "1.25.2"
def openalArchiveHash = "fb27e5839aa11f0e5b9d33756965291fad5d6909ab928ea1f796f4a1a6877894"
def vulkanHeadersVersion = "1.4.363.0"
def vulkanHeadersArchiveHash = "4a078be12bef21cfebc09d878b77a63cff9d68f899254a0b00d0e37ef73e7f7e"
def dependencyRoot = new File(settingsDir, "build/android-deps")
def sdlArchiveName = "SDL3-devel-${sdlVersion}-android.zip"
def sdlArchive = new File(dependencyRoot, sdlArchiveName)
def sdlAar = new File(dependencyRoot, "SDL3-${sdlVersion}.aar")
def openalRoot = new File(dependencyRoot, "openal-soft-${openalVersion}")
def openalArchive = new File(dependencyRoot, "openal-soft-${openalVersion}.tar.gz")
def vulkanHeadersRoot = new File(dependencyRoot,
    "Vulkan-Headers-vulkan-sdk-${vulkanHeadersVersion}")
def vulkanHeadersArchive = new File(dependencyRoot,
    "Vulkan-Headers-vulkan-sdk-${vulkanHeadersVersion}.tar.gz")

def sha256 = { File file ->
    def digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

dependencyRoot.mkdirs()
if (!sdlArchive.isFile() || sha256(sdlArchive) != sdlArchiveHash) {
    sdlArchive.delete()
    def temporary = new File(dependencyRoot, sdlArchive.name + ".part")
    temporary.delete()
    new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/${sdlArchive.name}")
        .withInputStream { input ->
            temporary.withOutputStream { output -> output << input }
        }
    if (sha256(temporary) != sdlArchiveHash) {
        temporary.delete()
        throw new GradleException("SDL3 ${sdlVersion} Android archive failed its SHA-256 check")
    }
    if (!temporary.renameTo(sdlArchive)) {
        throw new GradleException("Could not move the verified SDL archive into place")
    }
}
if (!sdlAar.isFile() || sha256(sdlAar) != sdlAarHash) {
    copy {
        from zipTree(sdlArchive)
        include("SDL3-${sdlVersion}.aar")
        into dependencyRoot
    }
    if (sha256(sdlAar) != sdlAarHash) {
        sdlAar.delete()
        throw new GradleException("SDL3 ${sdlVersion} AAR failed its SHA-256 check")
    }
}

if (!new File(openalRoot, "CMakeLists.txt").isFile()) {
    dependencyRoot.mkdirs()
    if (!openalArchive.isFile() || sha256(openalArchive) != openalArchiveHash) {
        openalArchive.delete()
        def temporary = new File(dependencyRoot, openalArchive.name + ".part")
        temporary.delete()
        new URL("https://github.com/kcat/openal-soft/archive/refs/tags/${openalVersion}.tar.gz")
            .withInputStream { input ->
                temporary.withOutputStream { output -> output << input }
            }
        if (sha256(temporary) != openalArchiveHash) {
            temporary.delete()
            throw new GradleException(
                "OpenAL Soft ${openalVersion} download failed its SHA-256 check")
        }
        if (!temporary.renameTo(openalArchive)) {
            throw new GradleException("Could not move the verified OpenAL Soft archive into place")
        }
    }
    copy {
        from tarTree(resources.gzip(openalArchive))
        into dependencyRoot
    }
}

def downloadVerifiedArchive = { String label, String url, File destination,
                                String expectedHash ->
    if (!destination.isFile() || sha256(destination) != expectedHash) {
        destination.delete()
        def temporary = new File(dependencyRoot, destination.name + ".part")
        temporary.delete()
        new URL(url).withInputStream { input ->
            temporary.withOutputStream { output -> output << input }
        }
        if (sha256(temporary) != expectedHash) {
            temporary.delete()
            throw new GradleException("${label} download failed its SHA-256 check")
        }
        if (!temporary.renameTo(destination)) {
            throw new GradleException("Could not move the verified ${label} archive into place")
        }
    }
}

if (!new File(vulkanHeadersRoot, "include/vulkan/vulkan.hpp").isFile()) {
    dependencyRoot.mkdirs()
    downloadVerifiedArchive("Vulkan-Headers ${vulkanHeadersVersion}",
        "https://github.com/KhronosGroup/Vulkan-Headers/archive/vulkan-sdk-${vulkanHeadersVersion}/Vulkan-Headers-vulkan-sdk-${vulkanHeadersVersion}.tar.gz",
        vulkanHeadersArchive, vulkanHeadersArchiveHash)
    copy {
        from tarTree(resources.gzip(vulkanHeadersArchive))
        into dependencyRoot
    }
}

rootProject.name = "DarkEngineRestored"
include(":app")
