// SDL 2.32.10 predates Android 13's explicit dynamic-receiver flags. Apply the
// small compatibility change already present on SDL's SDL2 maintenance branch
// so the USB HID path remains usable when targeting Android 16.
def hidManager = new File(sdlRoot,
    "android-project/app/src/main/java/org/libsdl/app/HIDDeviceManager.java")
def hidSource = hidManager.getText("UTF-8")
if (!hidSource.contains("private void registerReceiverCompat")) {
    def oldRegistration = "mContext.registerReceiver(mUsbBroadcast, filter);"
    if (!hidSource.contains(oldRegistration)) {
        throw new GradleException("SDL HID receiver compatibility patch no longer applies")
    }
    hidSource = hidSource.replace(oldRegistration,
        "registerReceiverCompat(mUsbBroadcast, filter);")
    hidSource = hidSource.replace(
        "mContext.registerReceiver(mBluetoothBroadcast, filter);",
        "registerReceiverCompat(mBluetoothBroadcast, filter);")
    def anchor = "    // Chromebooks do not pass along ACTION_ACL_CONNECTED / ACTION_ACL_DISCONNECTED properly."
    def helper = """    private void registerReceiverCompat(BroadcastReceiver receiver, IntentFilter filter) {
        if (Build.VERSION.SDK_INT >= 33) {
            mContext.registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED);
        } else {
            mContext.registerReceiver(receiver, filter);
        }
    }

"""
    if (!hidSource.contains(anchor)) {
        throw new GradleException("SDL HID receiver compatibility insertion point is missing")
    }
    hidManager.setText(hidSource.replace(anchor, helper + anchor), "UTF-8")
}

// SDL's hidden text editor consumes Back before the Activity sees it whenever
// the soft keyboard is visible. Add a virtual pre-IME hook so Thief can close
// its command terminal instead of merely dismissing the keyboard.
def sdlActivity = new File(sdlRoot,
    "android-project/app/src/main/java/org/libsdl/app/SDLActivity.java")
def activitySource = sdlActivity.getText("UTF-8")
if (!activitySource.contains("protected boolean onTextInputBackPressed")) {
    def activityAnchor = "    // Called by JNI from SDL.\n    public static void manualBackButton()"
    def activityHook = """    protected boolean onTextInputBackPressed(KeyEvent event) {
        return false;
    }

"""
    if (!activitySource.contains(activityAnchor)) {
        throw new GradleException("SDL text-input Back hook insertion point is missing")
    }
    activitySource = activitySource.replace(activityAnchor,
        activityHook + activityAnchor)

    def preImeAnchor = "        // As seen on StackOverflow: http://stackoverflow.com/questions/7634346/keyboard-hide-event"
    def preImeHook = """        if (keyCode == KeyEvent.KEYCODE_BACK &&
            SDLActivity.mSingleton != null &&
            SDLActivity.mSingleton.onTextInputBackPressed(event)) {
            return true;
        }

"""
    if (!activitySource.contains(preImeAnchor)) {
        throw new GradleException("SDL pre-IME Back interception point is missing")
    }
    sdlActivity.setText(activitySource.replace(preImeAnchor,
        preImeHook + preImeAnchor), "UTF-8")
}

